databases:
  - name: winarena-db
    databaseName: challengedb
    user: winarena
    plan: free

services:
  - type: web
    name: winarena-platform
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: winarena-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
